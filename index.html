<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search meals from around the world and discover easy cooking instructions."
    />
    <title>FlavorFind — Meal Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="#" aria-label="FlavorFind home">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>FlavorFind</span>
      </a>
      <p class="header-note">Recipes from around the world</p>
    </header>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Your next favorite dish is one search away</p>
          <h1 id="hero-title">Cook something <em>wonderful.</em></h1>
          <p class="hero-description">
            Search a meal by name and get delicious ideas with step-by-step
            cooking instructions.
          </p>

          <form id="search-form" class="search-form" role="search">
            <label class="sr-only" for="meal-query">Search for a meal</label>
            <div class="search-field">
              <span class="search-icon" aria-hidden="true"></span>
              <input
                id="meal-query"
                name="meal"
                type="search"
                placeholder="Try “chicken”, “pasta” or “curry”"
                autocomplete="off"
                required
              />
              <button type="submit">Find meals</button>
            </div>
